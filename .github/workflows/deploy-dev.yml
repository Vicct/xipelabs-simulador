name: CI-CD XipeLabs Dev

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

env:
  ENV_NAME: dev
  PREFIX: xipelabs-dev
  RESOURCE_GROUP: rg-xipelabs-dev
  LOCATION: eastus

jobs:
  build-unity-dev:
    name: Build Unity (Android) - Dev
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Unity Libraries
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('**/*.cs') }}
          restore-keys: |
            Library-

      - name: Build Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: Android
          unityVersion: 2022.3.22f1
          projectPath: ./unity

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XipeLabs-Android-DEV
          path: build/Android/*.apk

  deploy-infra-dev:
    name: Deploy Infra (Bicep) - Dev
    runs-on: ubuntu-latest
    needs: build-unity-dev

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Infra Dev
        run: |
          az group create -n $RESOURCE_GROUP -l $LOCATION
          az deployment group create \
            -g $RESOURCE_GROUP \
            -f infra/main.bicep \
            -p namePrefix=$PREFIX

  deploy-functions-dev:
    name: Deploy Functions - Dev
    runs-on: ubuntu-latest
    needs: deploy-infra-dev

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build API
        run: |
          cd api/Xipe.Api
          dotnet restore
          dotnet publish -c Release -o publish

      - name: Deploy to Azure Functions
        uses: azure/functions-action@v1
        with:
          app-name: xipelabs-dev-api
          package: api/Xipe.Api/publish